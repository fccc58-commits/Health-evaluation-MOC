<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استبيان خاص بنموذج الرعاية السعودي </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00838f;
            --primary-dark: #006064;
            --accent: #26a69a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); margin-bottom: 5px; }
        header p { color: #666; font-size: 15px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card h3 { margin-top: 0; color: var(--primary-dark); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #2c3e50; font-size: 14px; }
        select, input[type="number"], input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; font-family: 'Cairo', sans-serif; box-sizing: border-box; background-color: #fff; }
        select:focus, input:focus { border-color: var(--primary); outline: none; }
        .dynamic-container { background-color: #f8fafc; border-right: 4px solid var(--primary); padding: 15px; margin-top: 10px; border-radius: 6px; }
        .dynamic-item { margin-bottom: 12px; padding: 12px; background: #fff; border: 1px solid var(--border-color); border-radius: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background-color: var(--primary); color: white; padding: 12px 25px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; font-family: 'Cairo', sans-serif; transition: background 0.3s; margin-top: 10px; }
        .btn:hover { background-color: var(--primary-dark); }
        .admin-link { text-align: center; margin-top: 15px; }
        .admin-link a { color: #777; text-decoration: none; font-size: 13px; }
        .admin-link a:hover { color: var(--primary); text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>استبيان خاص بنموذج الرعاية السعودي</h1>
        <p>بوابة إدخال البيانات للقطاعات والمراكز الصحية</p>
    </header>

    <div class="card">
        <h3>إدخال تقييم جديد</h3>
        <form id="healthForm" onsubmit="saveDataToSheet(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="sectorSelect">القطاع الصحي:</label>
                    <select id="sectorSelect" onchange="updateCenters()" required>
                        <option value="">-- اختر القطاع --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="centerSelect">المركز الصحي التابع:</label>
                    <select id="centerSelect" disabled required>
                        <option value="">-- اختر المركز الصحي --</option>
                    </select>
                </div>
            </div>

            <!-- قائمة التخصصات مع خيار أخرى -->
            <div class="form-group">
                <label for="specialtySelect">التخصص:</label>
                <select id="specialtySelect" onchange="checkOtherSpecialty()" required>
                    <option value="">-- اختر التخصص --</option>
                    <option value="طبيب">طبيب</option>
                    <option value="تمريض">تمريض</option>
                    <option value="اشعة">اشعة</option>
                    <option value="مختبر">مختبر</option>
                    <option value="صحة عامة">صحة عامة</option>
                    <option value="إداري">إداري</option>
                    <option value="أخرى">أخرى (حدد التخصص)</option>
                </select>
                <div id="otherSpecialtyContainer" style="display: none; margin-top: 10px;">
                    <input type="text" id="otherSpecialtyInput" placeholder="أدخل التخصص الجديد هنا">
                </div>
            </div>

            <div class="form-group">
                <label for="systemsCount">عدد الأنظمة المطبقة:</label>
                <input type="number" id="systemsCount" min="0" value="0" oninput="renderDynamicInputs('systems')">
                <div id="systemsContainer" class="dynamic-container" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="pathwaysCount">عدد المسارات المطبقة:</label>
                <input type="number" id="pathwaysCount" min="0" value="0" oninput="renderDynamicInputs('pathways')">
                <div id="pathwaysContainer" class="dynamic-container" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label for="interventionsCount">عدد التدخلات المطبقة:</label>
                <input type="number" id="interventionsCount" min="0" value="0" oninput="renderDynamicInputs('interventions')">
                <div id="interventionsContainer" class="dynamic-container" style="display: none;"></div>
            </div>

            <button type="submit" class="btn">حفظ وإرسال البيانات</button>
        </form>
    </div>

    <div class="admin-link">
        <a href="admin.html">دخول مسؤول النظام (Admin)</a>
    </div>
</div>

    window.onload = function() {
        const sectorSelect = document.getElementById('sectorSelect');
        Object.keys(sectorData).sort().forEach(sector => {
            const opt = document.createElement('option');
            opt.value = sector;
            opt.textContent = sector;
            sectorSelect.appendChild(opt);
        });
    };

    window.updateCenters = function() {
        const sectorSelect = document.getElementById('sectorSelect');
        const centerSelect = document.getElementById('centerSelect');
        const selectedSector = sectorSelect.value;
        centerSelect.innerHTML = '<option value="">-- اختر المركز الصحي --</option>';
        if (selectedSector && sectorData[selectedSector]) {
            sectorData[selectedSector].forEach(center => {
                const opt = document.createElement('option');
                opt.value = center;
                opt.textContent = center;
                centerSelect.appendChild(opt);
            });
            centerSelect.disabled = false;
        } else {
            centerSelect.disabled = true;
        }
    };

        const specialtySelect = document.getElementById('specialtySelect');
        const otherContainer = document.getElementById('otherSpecialtyContainer');
        const otherInput = document.getElementById('otherSpecialtyInput');
        if (specialtySelect.value === 'أخرى') {
            otherContainer.style.display = 'block';
            otherInput.required = true;
        } else {
            otherContainer.style.display = 'none';
            otherInput.required = false;
            otherInput.value = '';
        }
    };

    window.renderDynamicInputs = function(type) {
        let countId = type + 'Count';
        let containerId = type + 'Container';
        let count = parseInt(document.getElementById(countId).value) || 0;
        let container = document.getElementById(containerId);
        container.innerHTML = '';
        if (count > 0) {
            container.style.display = 'block';
            for (let i = 1; i <= count; i++) {
                let div = document.createElement('div');
                div.className = 'dynamic-item';
                if (type === 'systems') {
                    div.innerHTML = `<label>اسم النظام (${i}):</label><input type="text" id="system_${i}" placeholder="أدخل اسم النظام" required>`;
                } else if (type === 'pathways') {
                    div.innerHTML = `<div class="grid-2"><div><label>اسم المسار (${i}):</label><input type="text" id="pathway_name_${i}" placeholder="أدخل اسم المسار" required></div><div><label>اسم المنسق:</label><input type="text" id="pathway_coord_${i}" placeholder="أدخل اسم منسق المسار" required></div></div>`;
                } else if (type === 'interventions') {
                    div.innerHTML = `<div class="grid-2"><div><label>اسم التدخل (${i}):</label><input type="text" id="inter_name_${i}" placeholder="أدخل اسم التدخل" required></div><div><label>اسم المنسق:</label><input type="text" id="inter_coord_${i}" placeholder="أدخل اسم منسق التدخل" required></div></div>`;
                }
                container.appendChild(div);
            }
        } else {
            container.style.display = 'none';
        }
    };

    window.saveDataToSheet = async function(event) {
        event.preventDefault();
        const sector = document.getElementById('sectorSelect').value;
        const center = document.getElementById('centerSelect').value;
        
        let specialtySelectVal = document.getElementById('specialtySelect').value;
        let specialty = specialtySelectVal;
        if (specialtySelectVal === 'أخرى') {
            let customVal = document.getElementById('otherSpecialtyInput').value;
            specialty = 'أخرى: ' + customVal;
        }
        
        const systemsCount = parseInt(document.getElementById('systemsCount').value) || 0;
        let systems = [];
        for (let i = 1; i <= systemsCount; i++) {
            let val = document.getElementById(`system_${i}`)?.value;
            if (val) systems.push(val);
        }

        const pathwaysCount = parseInt(document.getElementById('pathwaysCount').value) || 0;
        let pathways = [];
        for (let i = 1; i <= pathwaysCount; i++) {
            let name = document.getElementById(`pathway_name_${i}`)?.value;
            let coord = document.getElementById(`pathway_coord_${i}`)?.value;
            if (name || coord) pathways.push({ name, coord });
        }

        const interventionsCount = parseInt(document.getElementById('interventionsCount').value) || 0;
        let interventions = [];
        for (let i = 1; i <= interventionsCount; i++) {
            let name = document.getElementById(`inter_name_${i}`)?.value;
            let coord = document.getElementById(`inter_coord_${i}`)?.value;
            if (name || coord) interventions.push({ name, coord });
        }

        const record = {
            sector, center, specialty, systems, pathways, interventions,
            date: new Date().toLocaleString('ar-SA')
        };

        const submitBtn = document.querySelector('button[type="submit"]');
        try {
            submitBtn.textContent = "جاري الحفظ ...";
            submitBtn.disabled = true;

            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            });

            alert('تم حفظ البيانات بنجاح!');
            document.getElementById('healthForm').reset();
            document.getElementById('centerSelect').disabled = true;
            document.getElementById('otherSpecialtyContainer').style.display = 'none';
            document.getElementById('systemsContainer').style.display = 'none';
            document.getElementById('pathwaysContainer').style.display = 'none';
            document.getElementById('interventionsContainer').style.display = 'none';
        } catch (e) {
            console.error("خطأ:", e);
            alert('حدث خطأ أثناء الإرسال.');
        } finally {
            submitBtn.textContent = 'حفظ وإرسال البيانات';
            submitBtn.disabled = false;
        }
    };
</script>
</body>
</html>
